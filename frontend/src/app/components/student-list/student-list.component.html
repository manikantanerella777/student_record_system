<div class="student-list-container">
  <div class="header">
    <h2>Student Records</h2>
    <button class="btn btn-primary" routerLink="/add">
      <i class="icon-plus">+</i> Add New Student
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading students...</p>
  </div>

  <div *ngIf="error" class="error-message">
    <i class="icon-error">⚠</i>
    {{error}}
  </div>

  <div *ngIf="!loading && students.length > 0" class="table-container">
    <table class="students-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll Number</th>
          <th>Department</th>
          <th>Year</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students; trackBy: trackByStudentId">
          <td>{{ student.name }}</td>
          <td>{{ student.rollNumber }}</td>
          <td>{{ student.department || 'N/A' }}</td>
          <td>{{ student.year || 'N/A' }}</td>
          <td class="actions">
            <button class="btn btn-secondary btn-sm" (click)="editStudent(student._id!)" title="Edit Student">
              <i class="icon-edit">✏</i> Edit
            </button>
            <button class="btn btn-danger btn-sm" (click)="deleteStudent(student._id!)" title="Delete Student">
              <i class="icon-delete">🗑</i> Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && students.length === 0 && !error" class="empty-state">
    <div class="empty-icon">📚</div>
    <h3>No Students Found</h3>
    <p>Get started by adding your first student record.</p>
    <button class="btn btn-primary" routerLink="/add">Add First Student</button>
  </div>
</div>
